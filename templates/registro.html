{% extends "base.html" %}{% block c %}
<h1>Registro de usuario</h1>
<form method="POST" class="card narrow">
    <label>Rol
        <select name="rol">
            {% for k, n in roles.items() if k != 'paciente' %}
            <option value="{{ k }}">{{ n }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Nombre y apellido<input></label>
    <label>Teléfono<input></label>
    <label>Mail<input></label>
    <label>Matrícula (médico / gerente)<input></label>
    <label>Especialidades
        <select multiple>
            <option>Genética</option>
            <option>Pediatría</option>
            <option>Clínica médica</option>
        </select>
    </label>
    <label>Provincia que cubre (transportista)<input></label>
    <label>Contraseña<input type="password"></label>

    <button type="submit" class="btn">Registrar</button>
</form>
<p class="muted">Los pacientes se dan de alta desde el panel del Médico tratante y reciben usuario y contraseña por
    mail.</p>
{% endblock %}

<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Exoma Clínico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    {% from "macros.html" import act, badge, mapa with context %}
    <header><a href="{{ url_for('login') }}" style="color: inherit; text-decoration: none;">
            <b>🧬 Sistema de Exoma Clínico</b>
        </a><span>{% if rol %}{{ rol_nombre }} · <a href="{{ url_for('login') }}">Cambiar de rol</a>{% endif %}</span>
    </header>
    <div class="wrap">{% if nav %}<nav>{% for l, e in nav %}<a href="{{ url_for(e) }}"
                class="{{ 'on' if request.endpoint == e }}">{{ l }}</a>{% endfor %}</nav>{% endif %}
        <main>{% block c %}{% endblock %}</main>
    </div>
</body>

</html>
